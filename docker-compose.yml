services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: study-planner-backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: study-planner-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped